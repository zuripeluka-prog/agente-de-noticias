name: Agente Automático de Noticias

on:
  schedule:
    # Revisa cada 15 minutos si toca enviar. La hora real la decide tu panel.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Enviar el informe ahora, sin esperar la hora programada'
        required: false
        default: 'true'

# Evita que dos ejecuciones se pisen y manden el correo dos veces
concurrency:
  group: informe-diario
  cancel-in-progress: false

jobs:
  run-news-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar versión de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar script del Agente
        env:
          PYTHONUNBUFFERED: "1"
          FORZAR: ${{ github.event.inputs.forzar }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Panel de control
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python main.py
