name: Agente Automático de Noticias

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 12:00 UTC (ajusta según tu zona horaria)
    - cron: '0 12 * * *'
  # Permite ejecutarlo manualmente desde la pestaña Actions en cualquier momento
  workflow_dispatch:

jobs:
  run-news-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar versión de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar script del Agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
        run: python main.py
