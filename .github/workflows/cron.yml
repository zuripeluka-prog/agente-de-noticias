name: Agente Automático de Noticias

on:
  schedule:
    # Todos los días a las 12:17 UTC (7:17 am en Colombia)
    - cron: '5 21 * * *'
  workflow_dispatch:

jobs:
  run-news-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar versión de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar script del Agente
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
          # Opcional: remitente con dominio verificado en Resend
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          # Opcionales: para enviar a cualquier persona usando tu Gmail
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py
